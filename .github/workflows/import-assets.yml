name: Import licensed demo photographs
on:
  push:
    paths:
      - ".github/workflows/import-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate demo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photos
          curl -fLsS --retry 3 --max-time 90 "https://images.unsplash.com/photo-1553909489-cd47e0ef937f?auto=format&fit=crop&w=1250&q=78&fm=webp" -o assets/photos/hero.webp
          curl -fLsS --retry 3 --max-time 90 "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=900&q=78&fm=webp" -o assets/photos/focaccia.webp
          curl -fLsS --retry 3 --max-time 90 "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=78&fm=webp" -o assets/photos/savoury.webp
          curl -fLsS --retry 3 --max-time 90 "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=900&q=78&fm=webp" -o assets/photos/sweet.webp
          curl -fLsS --retry 3 --max-time 90 "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=900&q=78&fm=webp" -o assets/photos/coffee.webp
          curl -fLsS --retry 3 --max-time 90 "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1050&q=78&fm=webp" -o assets/photos/bread.webp
          for photo in assets/photos/*.webp; do
            test "$(wc -c < "$photo")" -gt 10000
            file "$photo" | grep -qi 'Web/P'
          done
      - name: Commit local assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          git diff --cached --quiet || (git commit -m "Cache optimized licensed concept photography locally" && git push)
