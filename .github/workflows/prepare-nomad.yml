name: Prepare Nomad concept imagery
on:
  push:
    paths:
      - ".github/workflows/prepare-nomad.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify illustrative photographs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/nomad
          get_photo() {
            local name="$1" id="$2"
            curl -fLsS --retry 3 --max-time 75 "https://images.unsplash.com/$id?auto=format&fit=crop&w=1500&q=79&fm=webp" -o "assets/nomad/$name.webp"
            file "assets/nomad/$name.webp" | grep -qi 'Web/P'
            test "$(wc -c < "assets/nomad/$name.webp")" -gt 11000
            echo "$name $(wc -c < "assets/nomad/$name.webp") bytes"
          }
          get_photo interior photo-1554118811-1e0d58224f24
          get_photo coffee photo-1509042239860-f550ce710b93
          get_photo sandwich photo-1528735602780-2552fd46c7af
          get_photo pastry photo-1555507036-ab1f4038808a
          get_photo workspace photo-1497366811353-6870744d04b2
      - name: Commit sample photos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nomad
          git diff --cached --quiet || (git commit -m "Prepare local coffee-shop stock photographs for Nomad concept" && git pull --rebase origin main && git push)
