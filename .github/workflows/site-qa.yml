name: Site QA — desktop and mobile
on:
  push:
    paths:
      - ".github/workflows/site-qa.yml"
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run browser QA and capture screenshots
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/day15-http.log 2>&1 &
          sleep 2
          mkdir -p qa/screenshots
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [1440,768,390,320]){
              const page=await browser.newPage({viewport:{width,height:850},deviceScaleFactor:1});
              page.on('pageerror',e=>errors.push(width+': '+e.message));
              const response=await page.goto('http://127.0.0.1:8765/',{waitUntil:'load'});
              if(response.status()!==200)throw Error(width+' page HTTP '+response.status());
              await page.locator('.hero-picture img').waitFor();
              await page.waitForTimeout(450);
              const state=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                img:[...document.images].map(i=>({src:i.getAttribute('src'),ok:i.complete&&i.naturalWidth>0})),
                css:getComputedStyle(document.querySelector('.hero')).backgroundColor,
                pageTitle:document.title
              }));
              if(state.overflow>2)errors.push(width+' horizontal overflow '+state.overflow+'px');
              if(state.img.some(i=>!i.ok))errors.push(width+' images missing '+JSON.stringify(state.img.filter(i=>!i.ok)));
              if(!state.css||state.css==='rgba(0, 0, 0, 0)')errors.push(width+' stylesheet not applied');
              await page.locator('.filter[data-filter="sweet"]').click();
              if(await page.locator('.food-card[data-category="savoury"]:visible').count())errors.push(width+' menu filtering failed');
              if(width<821){
                const toggle=page.locator('.menu-toggle');
                await toggle.click();
                if(await toggle.getAttribute('aria-expanded')!=='true')errors.push(width+' navigation failed to open');
                await page.locator('.mobile-nav a[href="#visit"]').click();
                if(await toggle.getAttribute('aria-expanded')!=='false')errors.push(width+' navigation failed to close');
              }
              await page.evaluate(()=>document.querySelectorAll('.reveal').forEach(e=>e.classList.add('is-visible')));
              await page.locator('.filter[data-filter="all"]').click();
              if(width===1440)await page.screenshot({path:'qa/screenshots/desktop.png',fullPage:true,animations:'disabled'});
              if(width===390)await page.screenshot({path:'qa/screenshots/mobile.png',fullPage:true,animations:'disabled'});
              await page.close();
              console.log('CHECK '+width+'px '+JSON.stringify({overflow:state.overflow,images:state.img.length,css:state.css}));
            }
            await browser.close();
            if(errors.length)throw Error(errors.join('\n'));
            console.log('PASS: desktop, tablet, mobile, navigation, filters, local images, CSS, JS errors, horizontal overflow');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save passing QA results
        run: |
          printf '%s\n' '# Site QA — PASS' '' 'Playwright Chromium tested 1440, 768, 390 and 320 px.' 'Verified CSS loading, all six local photographs, horizontal overflow, menu filters, mobile navigation and absence of page errors.' 'Screenshots are illustrative review evidence; owner-approved photography and details still required.' > qa/QA_REPORT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa
          git commit -m "Verify Day 15 responsive behaviour in Chromium and capture QA previews"
          git pull --rebase origin main
          git push
