name: Optimize Nomad image payloads
on:
  push:
    paths:
      - ".github/workflows/optimize-nomad.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize shipped photos
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("assets/nomad")
          widths = {"interior.webp":1250, "coffee.webp":850, "sandwich.webp":850, "pastry.webp":850}
          for filename, limit in widths.items():
              path = root / filename
              old_bytes = path.stat().st_size
              with Image.open(path) as image:
                  image = image.convert("RGB")
                  if image.width > limit:
                      h = round(image.height * limit / image.width)
                      image = image.resize((limit, h), Image.Resampling.LANCZOS)
                  image.save(path, format="WEBP", quality=75, method=6)
              with Image.open(path) as check:
                  check.verify()
              print(f"{filename}: {old_bytes:,} -> {path.stat().st_size:,} bytes")
          PY
      - name: Commit verified optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nomad/*.webp
          git diff --cached --quiet || (git commit -m "Compress all Nomad photo assets for mobile loading" && git pull --rebase origin main && git push)
