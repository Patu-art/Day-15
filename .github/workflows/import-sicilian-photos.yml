name: Import Sicilian food photo references
on:
  push:
    paths:
      - ".github/workflows/import-sicilian-photos.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download legally reusable food references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photos
          download() {
            local name="$1"
            local photo_id="$2"
            local target="assets/photos/$name.jpg"
            if curl -fLsS --retry 2 --max-time 100 -A "Mozilla/5.0" "https://unsplash.com/photos/$photo_id/download?force=true" -o "$target"; then
              if file "$target" | grep -Eq "JPEG|PNG|Web/P"; then
                echo "Verified $name"
                return
              fi
            fi
            echo "Image unavailable: $name" >&2
            rm -f "$target"
          }
          download hero-focaccia 38SpmDYNgFk
          download focaccia-closeup UFv76iOCKmA
          download arancini M3Vax7A5Hac
          download cannoli zZj6oQwhhTs
          download deli-counter l5Hqt9MJlv4
      - name: Commit available references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          git diff --cached --quiet || (git commit -m "Add locally hosted Sicilian food reference photos" && git push)
