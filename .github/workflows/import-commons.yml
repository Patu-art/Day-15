name: Download subject-correct reusable food photographs
on:
  push:
    paths:
      - ".github/workflows/import-commons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Import CC0 and attributed CC-BY samples from Wikimedia Commons
        shell: bash
        run: |
          mkdir -p assets/photos
          : > assets/photos/commons-import-status.txt
          download() {
            local file="$1" target="$2" encoded=""
            encoded=$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))" "$file")
            local source="https://commons.wikimedia.org/wiki/Special:Redirect/file/$encoded?width=960"
            if curl -fLsS --retry 2 --max-time 70 -A "Marleo-Concept-Demo/1.0 (public licensed-image client)" "$source" -o "assets/photos/$target"; then
              if file "assets/photos/$target" | grep -qi "JPEG"; then
                echo "PASS $target" | tee -a assets/photos/commons-import-status.txt
                return 0
              fi
            fi
            rm -f "assets/photos/$target"
            echo "FAIL $target" | tee -a assets/photos/commons-import-status.txt
          }
          download "Aubergine parmigiana focaccia, basil pesto, roasted tomato, mozzarella - Djanogly Café, Tate Britain 2026-03-24.jpg" "true-focaccia.jpg"
          download "Arancine.jpg" "true-arancini.jpg"
          download "Sicilian cannolo.jpg" "true-cannoli.jpg"
          download "Potenza - Fabio's 2026-02-12.jpg" "focaccia-candidate.jpg"
          download "Focaccia sandwiches for sale on the counter of Fabio's 2026-02-12.jpg" "focaccia-counter-candidate.jpg"
          download "Cannoli siciliani (edited).jpg" "cannoli-candidate.jpg"
          download "Arancini Al Ragu' - Giuseppes 2026-06-11.jpg" "arancini-candidate-a.jpg"
          download "Arancini (veggie) - Nanninella 2025-10-21.jpg" "arancini-candidate-b.jpg"
          download "Cannoli siciliani (7472226896).jpg" "cannoli-candidate-b.jpg"
          download "Panino prosciutteria.jpg" "focaccia-candidate-b.jpg"
          download "Sandwich with vegan cheese, tomatoes and basil.jpg" "focaccia-candidate-c.jpg"
      - name: Commit photos and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/
          git diff --cached --quiet || (git commit -m "Import locally hosted authentic Sicilian dish photography" && git pull --rebase origin main && git push)
